name: Maintain close-confirmation fork

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: close-confirmation-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUTF8: '1'

jobs:
  prepare:
    if: github.event.repository.fork && github.repository != 'herdrdev/herdr'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      build: ${{ steps.plan.outputs.build }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      version: ${{ steps.plan.outputs.version }}
      toolchain: ${{ steps.plan.outputs.toolchain }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test release planning and publication safeguards
        run: python -m unittest scripts.test_fork_maintenance
      - name: Detect stable release and apply the maintained patch
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fork_maintenance.py prepare --repository "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/prepared"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.plan.outputs.build == 'true'
        with:
          name: fork-plan
          path: ${{ runner.temp }}/prepared/plan.json
          if-no-files-found: error

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    name: Validate and build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            test_target: x86_64-unknown-linux-gnu
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            test_target: aarch64-unknown-linux-gnu
          - platform: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            test_target: x86_64-pc-windows-msvc
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: gcc
      HERDR_FORK_UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/manifest.json
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout exact patched source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Checkout automation helpers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fork-plan
          path: plan
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ needs.prepare.outputs.toolchain }}
          components: rustfmt,clippy
          targets: ${{ matrix.target }}
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: just,cargo-nextest
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install Linux build and performance tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools jq lsof tmux sysstat
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: source
          key: fork-${{ matrix.target }}
      - name: Lint and test
        env:
          CARGO_BUILD_TARGET: ${{ matrix.test_target }}
        run: just ci
      - name: Test close confirmation and updater on the musl release target
        if: runner.os == 'Linux'
        run: |
          just test-one 'client::shell::tests'
          just test-one 'update::'
      - name: Check documentation contracts
        run: just docs-contract-test
      - name: Build optimized binary
        run: just build
      - name: Verify static Linux binary and installer
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/herdr"
          file "$binary"
          if readelf -l "$binary" | grep -q 'INTERP'; then exit 1; fi
          if readelf -d "$binary" | grep -q '(NEEDED)'; then exit 1; fi
          if nm -u "$binary" | grep -E '(__cxa|GLIBCXX|CXXABI|_ZSt)'; then exit 1; fi
          bash ../automation/scripts/test_fork_installer.sh "$binary"
      - name: Compare release performance with upstream
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          baseline="$RUNNER_TEMP/herdr-upstream-baseline"
          curl -fL --retry 3 "https://github.com/herdrdev/herdr/releases/download/v$VERSION/herdr-linux-x86_64" -o "$baseline"
          chmod 755 "$baseline"
          HERDR_PERF_BASELINE_BIN="$baseline" scripts/release_perf_smoke.sh "target/$TARGET/release/herdr"
      - name: Package Linux files and validation report
        if: runner.os == 'Linux'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: python ../automation/scripts/fork_maintenance.py package --plan ../plan/plan.json --platform "$PLATFORM" --binary "target/$TARGET/release/herdr" --output ../output
      - name: Package signed ConPTY dependencies and Windows validation report
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'Microsoft.Windows.Console.ConPTY.nupkg'
          $stage = Join-Path $env:RUNNER_TEMP 'herdr-windows-x86_64'
          $archive = Join-Path $env:RUNNER_TEMP 'herdr-windows-x86_64.zip'
          ./scripts/package_windows_conpty.ps1 -HerdrExe "target/$env:TARGET/release/herdr.exe" -PackagePath $package -StageDir $stage -OutputPath $archive
          python ../automation/scripts/fork_maintenance.py package --plan ../plan/plan.json --platform $env:PLATFORM --binary "$stage/herdr.exe" --archive $archive --output ../output
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-${{ matrix.platform }}
          path: output/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fork-plan
          path: plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: fork-*-*
          merge-multiple: true
          path: artifacts
      - name: Publish only after every platform passes and uploaded checksums match
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fork_maintenance.py publish --repository "$GITHUB_REPOSITORY" --plan plan/plan.json --artifacts artifacts
